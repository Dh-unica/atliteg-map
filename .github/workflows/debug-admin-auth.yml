name: Debug Admin Auth

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: self-hosted
    environment:
      name: production
    steps:
      - name: Inspect backend env and login
        env:
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          set -e
          cd ${{ secrets.DEPLOY_PATH }}

          echo "=== Runner env (lengths + sha256, values masked) ==="
          printf 'ADMIN_USERNAME length: %s\n' "${#ADMIN_USERNAME}"
          printf 'ADMIN_PASSWORD length: %s\n' "${#ADMIN_PASSWORD}"
          printf 'ADMIN_USERNAME sha256: %s\n' "$(printf '%s' "$ADMIN_USERNAME" | sha256sum | cut -d' ' -f1)"
          printf 'ADMIN_PASSWORD sha256: %s\n' "$(printf '%s' "$ADMIN_PASSWORD" | sha256sum | cut -d' ' -f1)"
          printf 'ADMIN_PASSWORD starts with: %s\n' "$(printf '%s' "$ADMIN_PASSWORD" | head -c 2)"
          printf 'ADMIN_PASSWORD ends with: %s\n' "$(printf '%s' "$ADMIN_PASSWORD" | tail -c 2)"

          echo ""
          echo "=== Backend container env ==="
          docker compose exec -T backend sh -c '
            printf "container ADMIN_USERNAME length: %s\n" "${#ADMIN_USERNAME}"
            printf "container ADMIN_PASSWORD length: %s\n" "${#ADMIN_PASSWORD}"
            printf "container ADMIN_PASSWORD_HASH length: %s\n" "${#ADMIN_PASSWORD_HASH}"
            printf "container ADMIN_USERNAME sha256: %s\n" "$(printf "%s" "$ADMIN_USERNAME" | sha256sum | cut -d" " -f1)"
            printf "container ADMIN_PASSWORD sha256: %s\n" "$(printf "%s" "$ADMIN_PASSWORD" | sha256sum | cut -d" " -f1)"
          '

          echo ""
          echo "=== Reference sha256 for expected password a@kz9iKaBxi4hqX2 ==="
          printf '%s' 'a@kz9iKaBxi4hqX2' | sha256sum

          echo ""
          echo "=== Login attempt against backend (localhost) ==="
          PAYLOAD=$(printf '{"username":"%s","password":"%s"}' "$ADMIN_USERNAME" "$ADMIN_PASSWORD")
          docker compose exec -T backend sh -c "wget -qO- --header='Content-Type: application/json' --post-data='$PAYLOAD' http://localhost:3001/api/admin/login || true"

          echo ""
          echo "=== docker-compose config snippet for backend env ==="
          docker compose config | grep -A 20 'backend:' | head -40
