name: Fix External Nginx Upload Limit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fix-nginx:
    name: Diagnose and fix external nginx upload config
    runs-on: self-hosted
    environment:
      name: production

    steps:
      - name: 🔍 Diagnose external nginx config
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🔍 Diagnostica configurazione nginx esterna"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          echo ""
          echo "📋 Versione nginx:"
          nginx -v 2>&1 || echo "nginx non nel PATH"

          echo ""
          echo "📋 Configurazione nginx attiva:"
          echo "--- /etc/nginx/nginx.conf ---"
          cat /etc/nginx/nginx.conf 2>/dev/null || echo "File non trovato"

          echo ""
          echo "--- Sites enabled ---"
          ls -la /etc/nginx/sites-enabled/ 2>/dev/null || echo "Directory non trovata"

          echo ""
          echo "📋 Virtual host per atliteg:"
          for f in /etc/nginx/sites-enabled/*; do
            if grep -l -i "atliteg\|atlante\|9000" "$f" 2>/dev/null; then
              echo "--- $f ---"
              cat "$f"
            fi
          done

          echo ""
          echo "📋 Cerca client_max_body_size in config nginx:"
          grep -r "client_max_body_size\|client_body_buffer\|proxy_buffer" /etc/nginx/ 2>/dev/null || echo "Nessuna impostazione trovata"

          echo ""
          echo "📋 Log errori nginx recenti (upload related):"
          sudo tail -30 /var/log/nginx/error.log 2>/dev/null || tail -30 /var/log/nginx/error.log 2>/dev/null || echo "Non posso leggere i log"

          echo ""
          echo "📋 Docker container status:"
          cd ${{ secrets.DEPLOY_PATH }}
          docker compose ps
          docker compose logs --tail=20 backend

      - name: 🔧 Proponi fix
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🔧 Info per il fix manuale"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "Se il virtual host non ha client_max_body_size, aggiungere:"
          echo "  client_max_body_size 50M;"
          echo ""
          echo "Nel blocco server { } o location /api/ { } del virtual host"
          echo "Poi: sudo nginx -t && sudo systemctl reload nginx"
