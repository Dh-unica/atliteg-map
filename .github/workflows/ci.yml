name: CI

# Verifica che le immagini Docker si costruiscano correttamente.
# Utile soprattutto dopo aggiornamenti di dipendenze: il backend usa
# node:18-slim senza build tools e dipende dai prebuilt nativi (es. bcrypt),
# quindi un build Docker verde è la garanzia reale di deployabilità.

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  backend-docker-build:
    name: Build immagine Docker backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build immagine backend (node:18-slim, npm ci --only=production)
        run: docker build -t atliteg-backend:ci ./lemmario-dashboard/server

      - name: Smoke test backend nel container
        run: |
          docker run -d --name atliteg-be-ci -p 3001:3001 \
            -e NODE_ENV=production -e PORT=3001 \
            -e FRONTEND_API_KEYS=default_dev_key \
            -e ADMIN_USERNAME=admin -e JWT_SECRET=ci_secret \
            atliteg-backend:ci
          # Attende l'avvio del server
          for i in $(seq 1 30); do
            curl -sf http://localhost:3001/health >/dev/null 2>&1 && break
            sleep 1
          done
          # /health (server avviato, express/compression/cors caricati)
          echo "Health:"; curl -s http://localhost:3001/health; echo
          curl -sf http://localhost:3001/health >/dev/null
          # Auth middleware: senza API key -> 401 (non dipende dai dati)
          code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/api/lemmi)
          echo "GET /api/lemmi (senza key) -> $code"; test "$code" = "401"
          # Rotta dati con geojson.json (tracciato in git) -> 200
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "X-API-Key: default_dev_key" http://localhost:3001/api/geojson)
          echo "GET /api/geojson (con key) -> $code"; test "$code" = "200"
          # Login admin: valida bcrypt nativo + JWT (parti sensibili alle dipendenze)
          login=$(curl -s -X POST http://localhost:3001/api/admin/login \
            -H "Content-Type: application/json" \
            -d '{"username":"admin","password":"admin"}')
          echo "Login -> $(echo "$login" | head -c 120)"
          echo "$login" | grep -q '"success":true'

      - name: Cleanup
        if: always()
        run: docker rm -f atliteg-be-ci || true
