name: Deploy to Production

# Trigger automatico su push/merge al ramo master
on:
  push:
    branches:
      - master
  workflow_dispatch: # Permette esecuzione manuale dal tab Actions

# Permessi necessari per il workflow
permissions:
  contents: read

jobs:
  deploy:
    name: Deploy AtLiTeG Map Application
    # Usa il self-hosted runner installato sul server
    runs-on: self-hosted
    
    # Environment per gestire secrets e protezioni
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}

    # Env a livello di job: GitHub Actions inietta i secret direttamente
    # nell'environment del processo, senza passare da interpolazione shell.
    # In questo modo password con caratteri speciali ($, ", `, \, !, ecc.)
    # arrivano integre a `docker compose`, che le usa per la sostituzione
    # ${VAR} nel compose file con precedenza sulla `.env` del repo.
    env:
      FRONTEND_API_KEYS: ${{ secrets.FRONTEND_API_KEYS }}
      NEXT_PUBLIC_API_KEY: ${{ secrets.NEXT_PUBLIC_API_KEY }}
      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      ADMIN_PASSWORD_HASH: ""
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
      NEXT_PUBLIC_API_URL: ""
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}

    steps:
      # Step 1: Informazioni di avvio
      - name: 🚀 Inizio Deploy
        run: |
          echo "================================================"
          echo "🚀 Avvio procedura di deploy automatico"
          echo "================================================"
          echo "📦 Repository: ${{ github.repository }}"
          echo "🌿 Branch: ${{ github.ref_name }}"
          echo "👤 Autore commit: ${{ github.actor }}"
          echo "💬 Messaggio commit: ${{ github.event.head_commit.message }}"
          echo "🖥️  Server: $(hostname)"
          echo "👤 User: $(whoami)"
          echo "📂 Working directory: $(pwd)"
          echo "================================================"
      
      # Step 2: Git Pull
      - name: 📥 Git Pull del codice aggiornato
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📥 STEP 1: Pulling latest code from repository"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          cd ${{ secrets.DEPLOY_PATH }}
          
          echo "📍 Directory corrente: $(pwd)"
          echo "🌿 Branch corrente: $(git branch --show-current)"
          
          # Salva modifiche locali se esistono
          if [[ -n $(git status -s) ]]; then
            echo "⚠️  Modifiche locali rilevate, eseguo stash..."
            git stash
          fi
          
          # Pull del codice
          echo "📥 Download ultimi aggiornamenti..."
          git fetch origin master
          git checkout master
          git pull origin master
          
          echo "✅ Git pull completato con successo"
          echo "📊 Ultimo commit: $(git log -1 --pretty=format:'%h - %s (%an, %ar)')"

      # Step 3: Sincronizza risorse statiche
      - name: 📋 Sincronizza risorse statiche
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📋 STEP 2: Syncing static assets"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          cd ${{ secrets.DEPLOY_PATH }}

          echo "📂 Sincronizzazione directory data..."

          # Copia ricorsiva mantenendo la struttura, sovrascrivendo file esistenti
          # -r: ricorsivo
          # -v: verbose
          # -u: copia solo file più recenti
          cp -rvu lemmario-dashboard/public/data/* data/ 2>&1 | grep -v "omitted directory" || true

          echo "✅ Risorse statiche sincronizzate"
          echo "📁 Contenuto directory data:"
          ls -lh data/

          if [ -d "data/logo" ]; then
            echo ""
            echo "📁 Contenuto directory data/logo:"
            ls -lh data/logo/
          fi

      # Step 3b: Verifica e popolamento server/data/
      - name: 📊 Verifica dati lemmi
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📊 STEP 2b: Verifica e popolamento server/data/"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          cd ${{ secrets.DEPLOY_PATH }}/lemmario-dashboard

          mkdir -p server/data

          # Verifica se lemmi.json è già disponibile in server/data/
          if [ -f "server/data/lemmi.json" ] && [ -s "server/data/lemmi.json" ]; then
            echo "✅ lemmi.json presente in server/data/ ($(wc -c < server/data/lemmi.json) bytes)"
          elif [ -f "../data/lemmi.json" ] && [ -s "../data/lemmi.json" ]; then
            cp ../data/lemmi.json server/data/lemmi.json
            echo "✅ lemmi.json copiato in server/data/ da data/"
          elif [ -f "public/data/lemmi.json" ] && [ -s "public/data/lemmi.json" ]; then
            cp public/data/lemmi.json server/data/lemmi.json
            echo "✅ lemmi.json copiato in server/data/ da public/data/"
          else
            echo "⚠️  lemmi.json non disponibile in nessuna posizione."
            echo "   Il backend tenterà il recupero automatico da backup CSV all'avvio."
            echo "   In alternativa, caricare il CSV tramite l'interfaccia admin dopo il deploy."
          fi

          # Copia anche geojson.json e limits se necessario
          for f in geojson.json limits_IT_regions.geojson; do
            if [ ! -f "server/data/$f" ] || [ ! -s "server/data/$f" ]; then
              if [ -f "../data/$f" ]; then
                cp "../data/$f" "server/data/$f"
                echo "✅ $f copiato in server/data/"
              elif [ -f "public/data/$f" ]; then
                cp "public/data/$f" "server/data/$f"
                echo "✅ $f copiato in server/data/ da public/data/"
              fi
            fi
          done

          echo ""
          echo "📁 Contenuto server/data/:"
          ls -lh server/data/ || echo "(directory vuota o non esistente)"


      - name: 🏗️ Build dell'applicazione
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🏗️  STEP 3: Building application containers"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          cd ${{ secrets.DEPLOY_PATH }}

          echo "📋 Environment variables configured via job-level env (values hidden for security)"

          echo "🔨 Esecuzione docker compose build..."
          docker compose build --no-cache
          
          echo "✅ Build completato con successo"
          echo "📋 Immagini Docker disponibili:"
          docker images | grep atliteg || echo "Nessuna immagine atliteg trovata"
      
      # Step 5: Restart dei container
      - name: 🔄 Restart dei container
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🔄 STEP 4: Restarting application containers"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          cd ${{ secrets.DEPLOY_PATH }}

          # Stop containers esistenti
          echo "🛑 Stopping running containers..."
          docker compose down
          
          # Start nuovi containers
          echo "▶️  Starting new containers..."
          docker compose up -d
          
          # Attendi che i container siano healthy
          echo "⏳ Waiting for containers to be healthy (10 secondi)..."
          sleep 10
          
          echo "✅ Container riavviati con successo"
      
      # Step 6: Pulizia risorse Docker
      - name: 🧹 Pulizia risorse Docker
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🧹 Pulizia risorse Docker inutilizzate"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          cd ${{ secrets.DEPLOY_PATH }}
          
          echo "🗑️  Rimozione immagini dangling..."
          docker image prune -f
          
          echo "🗑️  Rimozione volumi non utilizzati..."
          docker volume prune -f
          
          echo "✅ Pulizia completata"
      
      # Step 7: Verifica deployment
      - name: 🔍 Verifica deployment
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🔍 Verifica finale del deployment"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          cd ${{ secrets.DEPLOY_PATH }}

          echo "📊 Container in esecuzione:"
          docker compose ps

          # Verifica health check
          CONTAINER_NAME="atliteg-lemmario-dashboard"
          if docker inspect --format='{{.State.Health.Status}}' $CONTAINER_NAME 2>/dev/null | grep -q "healthy\|starting"; then
            echo "✅ Container $CONTAINER_NAME is running and healthy"
          elif docker inspect --format='{{.State.Status}}' $CONTAINER_NAME 2>/dev/null | grep -q "running"; then
            echo "✅ Container $CONTAINER_NAME is running"
          else
            echo "⚠️  Warning: Could not verify container health status"
          fi

          echo ""
          echo "📝 Log recenti (ultime 20 righe):"
          docker compose logs --tail=20

          echo ""
          echo "💾 Utilizzo disco:"
          df -h | grep -E '(Filesystem|/$)'

          echo "✅ Verifica completata"

      # Step 7.5: Test multi-dominio (opzionale)
      - name: 🧪 Test accessibilità multi-dominio
        if: ${{ vars.RUN_DOMAIN_TESTS == 'true' }}
        continue-on-error: true
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🧪 Test accessibilità multi-dominio"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          cd ${{ secrets.DEPLOY_PATH }}

          # Verifica che lo script esista
          if [ ! -f "test-deployment.sh" ]; then
            echo "⚠️  Script test-deployment.sh non trovato, skip test"
            exit 0
          fi

          # Rendi eseguibile se necessario
          chmod +x test-deployment.sh

          # Esegui test
          echo "🚀 Esecuzione test su entrambi i domini..."
          ./test-deployment.sh || {
            echo "⚠️  Alcuni test sono falliti, ma il deploy continuerà"
            echo "💡 Controlla i log sopra per dettagli"
          }

          echo "✅ Test multi-dominio completato"

      # Step 8: Notifica risultato
      - name: 🎉 Deploy completato
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🎉 DEPLOY COMPLETATO CON SUCCESSO!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ Codice aggiornato"
          echo "✅ Applicazione ribuildata"
          echo "✅ Container riavviati"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📅 Timestamp: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "🔖 Version: $(cd ${{ secrets.DEPLOY_PATH }} && git describe --tags --always)"
          echo "🌐 L'applicazione è ora accessibile"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      
      # Step 9: Deployment Summary (per GitHub)
      - name: 📢 Deployment Summary
        if: success()
        run: |
          echo ""
          echo "╔════════════════════════════════════════════════════════╗"
          echo "║        ✅ DEPLOY PRODUCTION SUCCESSFUL ✅              ║"
          echo "╚════════════════════════════════════════════════════════╝"
          echo ""
          echo "📦 Repository: ${{ github.repository }}"
          echo "🌿 Branch: ${{ github.ref_name }}"
          echo "📝 Commit: ${{ github.sha }}"
          echo "👤 Author: ${{ github.actor }}"
          echo "💬 Message: ${{ github.event.head_commit.message }}"
          echo "🔗 Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo ""
      
      # Step 10: Gestione errori
      - name: 🚨 Notifica errore
        if: failure()
        run: |
          echo ""
          echo "╔════════════════════════════════════════════════════════╗"
          echo "║          ❌ DEPLOY PRODUCTION FAILED ❌                ║"
          echo "╚════════════════════════════════════════════════════════╝"
          echo ""
          echo "⚠️  Si è verificato un errore durante il deploy"
          echo "🔍 Controlla i log sopra per maggiori dettagli"
          echo "🔗 Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo ""
